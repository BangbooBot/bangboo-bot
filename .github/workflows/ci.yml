name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Bangboo.slnx

      - name: Build
        run: dotnet build Bangboo.slnx -c Release --no-restore

      # Microsoft.Testing.Platform (global.json). Integração usa Testcontainers (Docker já vem no runner).
      - name: Test
        run: dotnet test --solution Bangboo.slnx -c Release --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/**/TestResults/coverage.cobertura.xml
          if-no-files-found: ignore

      # O build gera openapi/Bangboo.Api.json; falha se o contrato mudou e não foi commitado
      - name: Check OpenAPI is up to date
        run: |
          git add -N openapi/
          git diff --exit-code -- openapi/ || {
            echo "::error::openapi/Bangboo.Api.json está desatualizado. Rode 'dotnet build' e commite a pasta openapi/."
            exit 1
          }

      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/Bangboo.Api.json
          if-no-files-found: error
